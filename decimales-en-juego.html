<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Decimales en Juego</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
<style>
/* Centro de misiones: fondo nocturno, tarjetas claras de alto contraste, un color por misión */
:root{
  --night:#121632;--night2:#1d2350;--card:#ffffff;--ink:#161a36;--muted:#565d82;--line:#dfe3f2;--soft:#f3f5fc;
  --ok:#15803d;--okbg:#dcfce7;--ko:#b45309;--kobg:#fef3c7;--gold:#f5b301;--mc:#06b6d4;
  --body:"Atkinson Hyperlegible",Verdana,Tahoma,system-ui,sans-serif;--display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;--fs:19px
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:var(--body);font-size:var(--fs);line-height:1.55;color:var(--ink);background:var(--night);background-image:radial-gradient(800px 500px at 0% -10%,#3b2a8a,transparent 60%),radial-gradient(700px 500px at 110% 0%,#0e5a73,transparent 55%);background-attachment:fixed}
body.big{--fs:23px}
.wrap{max-width:820px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left)) 48px}
.bar{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:14px}
.brand{flex:1;font-family:var(--display);font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pts{background:rgba(255,255,255,.14);border-radius:14px;padding:8px 12px;font-weight:700;font-size:16px;white-space:nowrap}
.ib{width:48px;height:48px;flex:none;border-radius:14px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:20px;font-weight:800;cursor:pointer;font-family:inherit}
.ib:hover{background:rgba(255,255,255,.28)}
.card{background:var(--card);border-radius:24px;padding:24px;box-shadow:0 18px 40px rgba(0,0,0,.3)}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0}
h1{font-size:clamp(32px,7vw,54px);color:#fff;text-wrap:balance}
h2{font-size:clamp(24px,5vw,32px);text-wrap:balance}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;font-size:1.05em;min-height:56px;padding:12px 24px;border-radius:16px;border:0;cursor:pointer;color:#fff;background:var(--mc);box-shadow:0 5px 0 rgba(0,0,0,.22);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.gold{background:var(--gold);color:#3a2a00}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 200px}
:focus-visible{outline:4px solid #facc15;outline-offset:3px}

/* Portada */
.hero{text-align:center;color:#fff;padding:30px 0 10px}
.hero .kicker{font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:14px;opacity:.8}
.hero p{max-width:44ch;margin:14px auto 26px;opacity:.9}
.badges{display:flex;justify-content:center;gap:12px;margin:22px 0;font-size:40px}
.badges span{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2)}

/* Mapa */
.mapgrid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:640px){.mapgrid{grid-template-columns:1fr 1fr}}
.mcard{display:flex;flex-direction:column;gap:10px;background:#fff;border-radius:22px;padding:18px;border-top:10px solid var(--c);box-shadow:0 12px 28px rgba(0,0,0,.25)}
.mhead{display:flex;gap:12px;align-items:center}
.memo{flex:none;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:32px;background:color-mix(in srgb,var(--c) 16%,#fff)}
.mnum{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.mtitle{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.15}
.mstate{font-size:15px;color:var(--muted)}
.mcard .btn{background:var(--c);width:100%}
.final{grid-column:1/-1;border-top-color:var(--gold)}
.final.locked{opacity:.75}
.lockmsg{font-size:15px;color:var(--muted)}
.gprog{height:14px;background:rgba(255,255,255,.18);border-radius:999px;overflow:hidden;margin:6px 0 18px}
.gprog i{display:block;height:100%;background:linear-gradient(90deg,#facc15,#fb923c);width:0;transition:width .6s}
.maplabel{color:#fff;font-weight:700;display:flex;justify-content:space-between;font-size:15px}

/* Explicación */
.ex{background:var(--soft);border-radius:18px;padding:16px 18px;margin-top:14px}
.ex b.k{color:var(--c)}
.exlist{display:grid;gap:10px;margin-top:14px}
.exitem{background:var(--soft);border-radius:16px;padding:12px 16px;border-left:8px solid var(--c)}
.exitem .t{font-weight:700}
.exitem .eg{color:var(--muted);font-size:.95em}
.dots{display:flex;gap:6px;justify-content:center;margin:16px 0 4px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--c)}

/* Juego */
.mbar{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:8px;font-weight:700;font-size:15px}
.mbar .tag{background:var(--c);color:#06111a;padding:4px 12px;border-radius:999px}
.mbar .sp{flex:1}
.prog{height:12px;background:rgba(255,255,255,.18);border-radius:999px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--c);width:0;transition:width .4s}
.ins{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.ins p{flex:1;margin:0;font-size:1.15em;font-weight:700;line-height:1.4}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sb{font:inherit;font-size:15px;font-weight:700;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer}
.hint{background:#eef6ff;border:2px dashed #93c5fd;border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:.95em}
.txt{background:var(--soft);border-radius:16px;padding:14px 16px;margin-bottom:14px;line-height:1.75;border-left:8px solid var(--c)}
.big-q{font-size:1.5em;font-weight:700;text-align:center;margin:6px 0 16px}
.gap{display:inline-block;min-width:2.6em;border-bottom:4px dashed var(--c);margin:0 4px;height:1em;vertical-align:baseline}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;font:inherit;min-height:60px;padding:12px 14px;border-radius:16px;border:3px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:color-mix(in srgb,var(--c) 60%,var(--line))}
.opt .l{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:#fff;border:2px solid var(--line);font-weight:700}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff)}
.opt.sel .l{background:var(--c);border-color:var(--c);color:#06111a}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--ko);background:var(--kobg);text-decoration:line-through;text-decoration-thickness:2px}
.opt:disabled{cursor:default}
.cls{display:grid;gap:10px}
.crow{display:grid;gap:8px;grid-template-columns:1fr;padding:12px;border-radius:16px;background:var(--soft);border:3px solid transparent}
@media(min-width:600px){.crow{grid-template-columns:minmax(120px,1fr) 2.2fr;align-items:center}}
.crow .w{font-weight:700;font-size:1.15em}
.cbtns{display:flex;gap:6px;flex-wrap:wrap}
.cb{flex:1 1 90px;font:inherit;font-size:16px;font-weight:700;min-height:48px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.cb.sel{background:var(--c);border-color:var(--c);color:#06111a}
.crow.right{border-color:var(--ok);background:var(--okbg)}
.crow.wrong{border-color:var(--ko);background:var(--kobg)}
.cb:disabled{cursor:default}
.target{min-height:72px;border:3px dashed var(--line);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:var(--soft);margin-bottom:12px}
.target:empty::before{content:"Toca las piezas en orden 👇";color:var(--muted);font-size:16px;align-self:center;padding-left:4px}
.target.right{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.target.wrong{border-style:solid;border-color:var(--ko);background:var(--kobg)}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:700;min-height:48px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--line)}
.target .chip{border-color:var(--c)}
.chip:disabled{cursor:default}
.syl{display:flex;flex-wrap:nowrap;justify-content:center;font-size:clamp(22px,6.5vw,44px);font-weight:700;padding:18px 6px;border:3px dashed var(--line);border-radius:18px;background:var(--soft)}
.syl.right{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.syl.wrong{border-style:solid;border-color:var(--ko);background:var(--kobg)}
.sc{padding:0 2px}
.sg{width:12px;flex:none;border:0;padding:0;background:transparent;cursor:pointer;border-radius:8px;position:relative}
.sg:hover:not(:disabled){background:color-mix(in srgb,var(--c) 20%,transparent)}
.sg.on::after{content:"-";position:absolute;inset:0;display:grid;place-items:center;color:var(--c);font-weight:800}
.sylprev{text-align:center;margin-top:10px;color:var(--muted)}
.sylprev b{color:var(--ink);font-size:1.2em;letter-spacing:.04em}
.fb{margin-top:16px;border-radius:16px;padding:14px 16px;animation:up .35s ease}
.fb.ok{background:var(--okbg);border:2px solid #86efac}
.fb.ko{background:var(--kobg);border:2px solid #fcd34d}
.fb .h{display:block;font-weight:700;font-size:1.1em;margin-bottom:4px}
.fb p{margin:0}
.acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.acts .btn{flex:1 1 200px}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pop{animation:up .35s ease}
.float{position:fixed;z-index:50;font-family:var(--display);font-weight:800;font-size:30px;color:var(--gold);text-shadow:0 2px 0 #7a5600;pointer-events:none;animation:fl 1s ease forwards}
@keyframes fl{to{opacity:0;transform:translateY(-70px)}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(160px);background:#0b0e22;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;transition:transform .3s;max-width:92vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}

/* Resultados */
.medal{font-size:72px;text-align:center;line-height:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0}
.stat{background:var(--soft);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.6em;color:var(--c)}
.stat span{font-size:14px;color:var(--muted);font-weight:700}
.rep table{width:100%;border-collapse:collapse;font-size:.95em}
.rep th,.rep td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.rep th{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tbl{overflow-x:auto}
.pill{display:inline-block;font-size:14px;font-weight:700;padding:3px 10px;border-radius:999px}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.pr{background:var(--kobg);color:#92400e}
.pill.no{background:var(--soft);color:var(--muted)}
.rep h3{margin:22px 0 8px;font-size:1.2em}
.rep ul{margin:0;padding-left:22px}
.rep li{margin-bottom:6px}
input.wri{width:100%;font:inherit;font-size:1.25em;padding:14px 16px;border-radius:16px;border:3px solid var(--line);background:#fff;color:var(--ink)}
input.wri:focus,textarea.free:focus{outline:none;border-color:var(--c)}
input.wri.right{border-color:var(--ok);background:var(--okbg)}input.wri.wrong{border-color:var(--ko);background:var(--kobg)}
textarea.free{width:100%;min-height:170px;font:inherit;line-height:1.6;padding:14px 16px;border-radius:16px;border:3px solid var(--line);background:#fff;color:var(--ink);resize:vertical}
.ideas{font-size:.92em;color:var(--muted);margin:0 0 12px}
.wc{font-size:14px;color:var(--muted);margin-top:6px;text-align:right}
.checks{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:6px}
.checks li{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:12px;padding:8px 12px;font-size:.95em}
.checks input{width:24px;height:24px;flex:none;accent-color:var(--c)}
.freerep{background:var(--soft);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.freerep .q{font-size:14px;color:var(--muted);font-weight:700}
.freerep .a{white-space:pre-wrap;margin-top:4px}
figure.vis{margin:0 0 16px;display:flex;flex-direction:column;align-items:center}
.cap{margin-top:8px;font-weight:700;font-size:.95em;background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:10px;padding:4px 12px;text-align:center}
.ladder{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px}
.lb{display:flex;flex-direction:column;align-items:center;background:#fff;border:3px solid var(--c);border-radius:14px;padding:8px 12px;min-width:84px}
.lb b{font-size:1.4em}.lb span{font-weight:700}.lb small{color:var(--muted)}
.la{font-weight:700;color:var(--c);font-size:.9em}
.la::after{content:" →"}
@media(max-width:560px){.ladder{flex-direction:column;gap:4px}.lb{min-width:160px}.la::after{content:" ↓"}}
figure.vis svg{max-width:100%;height:auto}
.vis-c rect.on{fill:var(--c)}.vis-c rect.off{fill:#fff;stroke:#9aa1c4}
.pv{border-collapse:separate;border-spacing:6px;margin:0 auto}
.pv th{font-size:15px;color:var(--muted);font-weight:700;padding:0 6px}
.pv td{width:58px;height:62px;text-align:center;font-size:32px;font-weight:700;background:var(--soft);border-radius:12px;border:2px solid var(--line)}
.pv td.cm{width:20px;background:none;border:0;font-size:40px}
.pv td.u{border-color:#94a3b8}.pv td.d{border-color:var(--c)}.pv td.c{border-color:#f59e0b}.pv td.m{border-color:#22c55e}
.colop{font-family:"Courier New",ui-monospace,monospace;font-size:34px;font-weight:700;line-height:1.35;display:inline-grid;padding:12px 22px;background:var(--soft);border-radius:16px;border:2px solid var(--line)}
.colop .r{display:flex;justify-content:flex-end;white-space:pre}
.colop .g{color:#b8bdd6}.colop .cm{color:var(--c)}
.colop .ln{border-top:4px solid var(--ink);margin-top:4px;height:6px}
.plan{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.plan span{font-size:13px;font-weight:700;background:var(--soft);border:2px solid var(--line);border-radius:999px;padding:4px 10px}
.fracw{display:flex;align-items:center;gap:16px;font-weight:700}
.frac{display:inline-flex;flex-direction:column;align-items:center;font-size:44px;line-height:1.1}
.frac span:first-child{border-bottom:4px solid var(--ink);padding:0 10px}
.feq{font-size:40px;color:var(--c)}
.kp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.kp button{font:inherit;font-size:22px;font-weight:700;min-height:52px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.kp button.cmk{background:color-mix(in srgb,var(--c) 18%,#fff);border-color:var(--c)}
@media(max-width:420px){.kp{grid-template-columns:repeat(4,1fr)}.colop{font-size:28px}.pv td{width:46px;height:54px;font-size:26px}}
input.txt2{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:3px solid var(--line)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
footer{color:rgba(255,255,255,.65);text-align:center;font-size:13px;margin-top:20px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff!important;color:#000;font-size:12pt}
  .bar,footer,.noprint,#fx,.toast{display:none!important}
  .card{box-shadow:none;padding:0}
  .wrap{max-width:none;padding:0}
}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="bar">
    <div class="brand">🏐 Decimales en Juego</div>
    <div class="pts" id="ptsBox" aria-live="polite">⭐ <span id="pts">0</span></div>
    <button class="ib" id="bigBtn" title="Letra más grande" aria-label="Cambiar tamaño de letra">Aa</button>
    <button class="ib" id="muteBtn" title="Sonido" aria-label="Activar o silenciar sonidos">🔊</button>
  </div>
  <main id="app"></main>
  <footer>Decimales en Juego · Matemáticas · No se guarda ningún dato del alumno</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =================== CONTENIDO =================== */
const MISSIONS=[
{id:'m1',n:1,title:'¿Qué es un decimal?',emoji:'🧩',c:'#06b6d4',
 goal:'Décimas, centésimas y milésimas.',
 intro:[
  {h:'La décima',items:[
   {t:'Imagina una tableta de chocolate',d:'La tableta entera es <b>1 unidad</b>.<br>La partimos en <b>10 trozos iguales</b>.',vis:{type:'g10',n:10,cap:'Tableta entera: 10 trozos = 1 unidad'}},
   {t:'Cada trozo es una décima',d:'<b>1 trozo</b> = <b>1 décima</b>.<br>Se escribe así: <b>0,1</b>',vis:{type:'g10',n:1,cap:'1 trozo = 1 décima = 0,1'}},
   {t:'Cuenta los trozos',d:'Si te comes <b>3 trozos</b>, te comes <b>3 décimas</b>.',vis:{type:'g10',n:3,cap:'3 trozos = 3 décimas = 0,3'}}]},
  {h:'La centésima',items:[
   {t:'Trozos más pequeños',d:'Ahora partimos la unidad en <b>100 cuadritos iguales</b>.<br><b>1 cuadrito</b> = <b>1 centésima</b> = <b>0,01</b>',vis:{type:'g100',n:1,cap:'1 cuadrito coloreado = 0,01'}},
   {t:'Una fila es una décima',d:'Cada fila tiene <b>10 cuadritos</b>.<br>Por eso: <b>1 décima = 10 centésimas</b>.',vis:{type:'g100',n:10,cap:'1 fila = 10 centésimas = 0,1'}},
   {t:'Con dinero',d:'<b>1 euro</b> tiene <b>100 céntimos</b>.<br>Cada céntimo es <b>una centésima</b> de euro.',eg:'1 céntimo = 0,01 € · 25 céntimos = 0,25 €'}]},
  {h:'La milésima',items:[
   {t:'Trozos muy, muy pequeños',d:'Si partimos la unidad en <b>1000 trozos</b>,<br>cada trozo es <b>1 milésima</b> = <b>0,001</b>'},
   {t:'Un ejemplo real',d:'Una botella de <b>1 litro</b> tiene <b>1000 mililitros</b>.<br>Cada mililitro es <b>una milésima</b> de litro.',eg:'1 mililitro = 0,001 litros'},
   {t:'Recuerda',d:'Cada vez que partimos en 10, el trozo es <b>10 veces más pequeño</b>.<br>Mira cuántas cifras hay después de la coma.',vis:{type:'ladder'}}]},
  {h:'Las dos partes de un decimal',items:[
   {t:'La coma separa',d:'A la <b>izquierda</b>: las unidades enteras.<br>A la <b>derecha</b>: los trozos.',vis:{type:'tab',num:'2,35',cap:'2 unidades y 35 centésimas'}},
   {t:'Están en todas partes',d:'Precios, medidas y tiempos.',eg:'12,50 € · 1,65 m · 9,8 puntos'}]}],
 items:[
  {t:'mc',c:'Décimas, centésimas y milésimas',ins:'Elige el número de la parte coloreada.',vis:{type:'g10',n:7},o:['0,7','7','0,07'],a:0,
   h:'Cada trozo es <b>0,1</b>.<br>Cuenta los trozos de color.',e:'<b>7 trozos</b> de 10 = <b>7 décimas</b> = <b>0,7</b>'},
  {t:'mc',c:'Décimas, centésimas y milésimas',ins:'Elige el número de la parte coloreada.',vis:{type:'g100',n:45},o:['4,5','0,45','0,045'],a:1,
   h:'Cada cuadrito es <b>0,01</b>.<br>Hay 4 filas enteras y 5 cuadritos más.',e:'<b>45 cuadritos</b> de 100 = <b>0,45</b>'},

function visHTML(v){
  if(!v)return '';
  const h=visCore(v);return v.cap?h.replace(/<\/figure>$/,`<figcaption class="cap">${v.cap}</figcaption></figure>`):h;
}
function visCore(v){
  if(v.type==='ladder'){const L=[['1','unidad','sin coma'],['0,1','décima','1 cifra'],['0,01','centésima','2 cifras'],['0,001','milésima','3 cifras']];
    return `<figure class="vis"><div class="ladder" aria-label="Escalera: unidad, décima, centésima, milésima">${L.map((x,i)=>`${i?'<span class="la">÷10</span>':''}<div class="lb"><b>${x[0]}</b><span>${x[1]}</span><small>${x[2]}</small></div>`).join('')}</div></figure>`}
  if(v.type==='frac'){return `<figure class="vis" aria-label="Fracción ${v.n} partido por ${v.d}"><div class="fracw"><div class="frac"><span>${v.n}</span><span>${v.d}</span></div>${v.eq?`<span class="feq">${v.eq}</span>`:''}</div></figure>`}
  if(v.type==='g10'){let s='';for(let i=0;i<10;i++)s+=`<rect class="${i<v.n?'on':'off'}" x="${4+i*40}" y="4" width="36" height="56" rx="6" stroke-width="2"/>`;return `<figure class="vis vis-c" aria-label="Barra dividida en 10 partes, ${v.n} coloreadas"><svg viewBox="0 0 408 64" width="408">${s}</svg></figure>`}
  if(v.type==='g100'){let s='';for(let i=0;i<100;i++){const r=Math.floor(i/10),c=i%10;s+=`<rect class="${i<v.n?'on':'off'}" x="${3+c*22}" y="${3+r*22}" width="20" height="20" rx="3" stroke-width="1.5"/>`}return `<figure class="vis vis-c" aria-label="Cuadrado de 100 cuadritos, ${v.n} coloreados"><svg viewBox="0 0 226 226" width="226">${s}</svg></figure>`}
  if(v.type==='line'){let s='<line x1="20" y1="50" x2="420" y2="50" stroke="#161a36" stroke-width="3"/>';for(let i=0;i<=10;i++){const x=20+i*40,big=i===0||i===10;s+=`<line x1="${x}" y1="${big?34:40}" x2="${x}" y2="${big?66:60}" stroke="#161a36" stroke-width="${big?3:2}"/>`}
    s+=`<text x="20" y="92" text-anchor="middle" font-size="22" font-weight="700" fill="#161a36">0</text><text x="420" y="92" text-anchor="middle" font-size="22" font-weight="700" fill="#161a36">1</text>`;
    const mx=20+v.mark*400;s+=`<path d="M${mx-12} 6 L${mx+12} 6 L${mx} 30 Z" style="fill:var(--c)"/>`;
    return `<figure class="vis" aria-label="Recta numérica de 0 a 1 con una flecha"><svg viewBox="0 0 440 100" width="440">${s}</svg></figure>`}
  if(v.type==='tab'){const [e,d='']=v.num.split(',');const cols=[...e].map(x=>`<td class="u">${x}</td>`).join('');const hd=[...e].map((x,i)=>`<th>${e.length>1&&i===0?'D':'U'}</th>`).join('');const dn=['d','c','m'];
    return `<figure class="vis"><table class="pv" aria-label="Tabla de valor posicional de ${v.num}"><tr>${hd}<th></th>${[...d].map((x,i)=>`<th>${dn[i]}</th>`).join('')}</tr><tr>${cols}<td class="cm">,</td>${[...d].map((x,i)=>`<td class="${dn[i]}">${x}</td>`).join('')}</tr></table></figure>`}
  if(v.type==='col'){
    if(v.op==='×'){const w=Math.max(...v.n.map(s=>s.length))+2;const rows=v.n.map((s,i)=>`<div class="r">${i===v.n.length-1?'× ':'  '}${s.replace(',','<span class="cm">,</span>').padStart(0)}</div>`);
      return `<figure class="vis"><div class="colop" aria-label="Multiplicación ${v.n.join(' por ')}">${rows.join('')}<div class="ln"></div><div class="r" style="color:#b8bdd6">?</div></div></figure>`}
    const parts=v.n.map(s=>{const [e,d='']=s.split(',');return {e,d}});const E=Math.max(...parts.map(p=>p.e.length)),Dd=Math.max(...parts.map(p=>p.d.length));
    const rows=parts.map((p,i)=>{const pad=' '.repeat(E-p.e.length);const dec=p.d+'0'.repeat(Dd-p.d.length);const decH=p.d+`<span class="g">${'0'.repeat(Dd-p.d.length)}</span>`;
      return `<div class="r">${i===parts.length-1?v.op+' ':'  '}${pad}${p.e}${Dd?`<span class="${p.d?'cm':'cm g'}">,</span>${decH}`:''}</div>`});
    return `<figure class="vis"><div class="colop" aria-label="Operación en columna">${rows.join('')}<div class="ln"></div><div class="r" style="color:#b8bdd6">?</div></div></figure>`}
  return '';
}

function confetti(){
  const cv=$('#fx'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#06b6d4','#f59e0b','#ec4899','#84cc16','#f5b301','#a78bfa'];
  const ps=Array.from({length:140},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.3,s:6+Math.random()*7,c:pick(cols)}));
  const t0=performance.now();(function f(t){x.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(t-t0<3500)requestAnimationFrame(f);else x.clearRect(0,0,cv.width,cv.height)})(t0);
}
