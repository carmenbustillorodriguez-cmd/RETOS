<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>Código de Puntuación · Lengua 1.º ESO</title>
<style>
:root{--c1:#1d4ed8;--c2:#0891b2;--ink:#1c2042;--muted:#5b6287;--line:#e2e5f3;--soft:#f5f6fc;--ok:#15803d;--okbg:#dcfce7;--ko:#b91c1c;--kobg:#fee2e2;--fs:18px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:Verdana,Tahoma,"Segoe UI",system-ui,sans-serif;font-size:var(--fs);line-height:1.55;color:var(--ink);background:#141833;background-image:radial-gradient(900px 520px at 5% -10%,var(--c2),transparent 60%),radial-gradient(700px 520px at 110% 5%,var(--c1),transparent 55%);background-attachment:fixed}
body.big{--fs:22px}
.wrap{max-width:780px;margin:0 auto;padding:14px 14px 48px}
.bar{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:12px}
.brand{flex:1;font-weight:800;font-size:15px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:46px;height:46px;flex:none;border-radius:14px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center;font-family:inherit;font-weight:800}
.ib:hover{background:rgba(255,255,255,.28)}
.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 18px 40px rgba(0,0,0,.28)}
.hero{text-align:center}
.badge{width:96px;height:96px;margin:4px auto 10px;border-radius:28px;display:grid;place-items:center;font-size:52px;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 10px 24px rgba(0,0,0,.2);transform:rotate(-4deg)}
h1,h2{font-family:"Arial Black","Segoe UI Black",Impact,system-ui,sans-serif;letter-spacing:-.01em}
h1{font-size:clamp(26px,6vw,38px);line-height:1.1;margin:6px 0}
h2{font-size:clamp(22px,5vw,30px);line-height:1.15;margin:8px 0}
.sub{color:var(--muted);margin:0 0 14px}
.how{background:var(--soft);border-radius:16px;padding:12px 16px;text-align:left;font-size:.9em}
.steps{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.step{background:var(--soft);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.steps.mini{margin:16px 0 0;opacity:.8}
.steps.mini .step{font-size:12px;padding:3px 10px}
label.lbl{display:block;font-weight:800;margin:18px 0 6px;text-align:left}
input.txt,select.txt{width:100%;font:inherit;padding:13px 15px;border-radius:14px;border:3px solid var(--line);outline:none;background:#fff;color:var(--ink)}
input.txt:focus,select.txt:focus{border-color:var(--c1)}
.hint{font-size:14px;color:var(--muted);text-align:left;margin-top:6px;min-height:1.2em}
.hint.err{color:var(--ko);font-weight:700}
.lvls{display:grid;gap:10px}
.lvl{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;color:var(--ink);padding:12px 14px;border-radius:16px;border:3px solid var(--line);border-left:12px solid var(--lc);background:#fff;cursor:pointer}
.lvl small{display:block;color:var(--muted);font-size:14px;line-height:1.35}
.lvl[aria-pressed=true]{border-color:var(--lc);background:color-mix(in srgb,var(--lc) 10%,#fff);box-shadow:0 0 0 3px color-mix(in srgb,var(--lc) 25%,transparent)}
.lvl-e{font-size:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:800;font-size:1.05em;padding:15px 22px;border-radius:16px;border:0;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.wide{width:100%;margin-top:20px}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.pill{background:rgba(255,255,255,.15);color:#fff;border-radius:14px;padding:8px 4px;text-align:center;font-weight:800;font-size:16px;line-height:1.2}
.pill small{display:block;font-weight:600;font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.04em}
.prog{height:14px;background:rgba(255,255,255,.2);border-radius:999px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#fde047,#fb923c);border-radius:inherit;transition:width .5s}
.passage{margin-bottom:14px}
.ptop{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ptop h3{flex:1;margin:0;font-size:1em}
.sb{border:2px solid var(--line);background:var(--soft);border-radius:12px;padding:6px 10px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink);white-space:nowrap}
.ptext p{margin:0 0 12px;line-height:1.8}
.ptext h4{margin:6px 0 10px;font-size:1.1em;text-align:center}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.qnum{flex:1;font-weight:800;color:var(--c1);font-size:14px;text-transform:uppercase;letter-spacing:.05em}
.q{font-size:1.15em;font-weight:700;margin:0 0 16px;line-height:1.55}
.gap{display:inline-block;min-width:2.4em;height:1em;border-bottom:4px dashed var(--c1);margin:0 4px;vertical-align:baseline}
mark{background:#fde68a;color:inherit;padding:1px 6px;border-radius:8px}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;font:inherit;padding:14px;border-radius:16px;border:3px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer;transition:transform .12s,border-color .12s,background .12s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:color-mix(in srgb,var(--c1) 45%,var(--line))}
.ltr{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#fff;border:2px solid var(--line);font-weight:800;font-size:15px}
.opt.sel{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 12%,#fff)}
.opt.sel .ltr{background:var(--c1);color:#fff;border-color:var(--c1)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .ltr{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--ko);background:var(--kobg)}
.opt.wrong .ltr{background:var(--ko);color:#fff;border-color:var(--ko)}
.opt:disabled{cursor:default}
.opts.sym{grid-template-columns:repeat(3,1fr)}
.opts.sym .opt{flex-direction:column;justify-content:center;text-align:center;gap:4px;padding:12px 6px}
.opts.sym .ltr{display:none}
.sym-c{font-size:44px;font-weight:900;line-height:1;font-family:Georgia,"Times New Roman",serif}
.sym-n{font-size:12px;color:var(--muted);font-weight:700;line-height:1.2}
.target{min-height:72px;border:3px dashed var(--line);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;align-items:center;background:var(--soft);margin-bottom:12px}
.target:empty::before{content:"Toca las palabras en orden 👇";color:var(--muted);font-size:15px;padding-left:4px}
.target.right{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.target.wrong{border-style:solid;border-color:var(--ko);background:var(--kobg)}
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:48px}
.chip{font:inherit;font-weight:700;padding:9px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;box-shadow:0 3px 0 var(--line);color:var(--ink)}
.target .chip{border-color:var(--c1);box-shadow:0 3px 0 color-mix(in srgb,var(--c1) 40%,#fff)}
.chip:disabled{cursor:default}
.tools{display:flex;justify-content:flex-end;margin-top:10px}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .btn{flex:1}
.timebar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin-bottom:14px}
.timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#facc15,#f97316);transform-origin:left}
.fb{margin-top:16px;border-radius:16px;padding:14px 16px;animation:up .35s ease}
.fb.ok{background:var(--okbg);border:2px solid #86efac}
.fb.ko{background:var(--kobg);border:2px solid #fca5a5}
.fb .big{display:block;font-size:1.1em;margin-bottom:4px}
.fb p{margin:0}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pop{animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:scale(.98) translateY(8px)}to{opacity:1;transform:none}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.float{position:fixed;z-index:50;font-family:"Arial Black",system-ui,sans-serif;font-size:28px;color:#facc15;text-shadow:0 2px 0 #92400e;pointer-events:none;animation:fl 1s ease forwards}
@keyframes fl{to{opacity:0;transform:translateY(-70px)}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(160px);background:#111827;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;transition:transform .3s;max-width:92vw;text-align:center;font-size:16px}
.toast.on{transform:translateX(-50%) translateY(0)}
.res-emoji{font-size:68px;line-height:1;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}
.stat{background:var(--soft);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:"Arial Black",system-ui,sans-serif;font-size:1.5em;color:var(--c1);line-height:1.25}
.stat span{font-size:13px;color:var(--muted);font-weight:700}
.codebox{border:3px dashed var(--c1);border-radius:16px;padding:14px;background:color-mix(in srgb,var(--c1) 6%,#fff);text-align:left;font-size:15px;word-break:break-word}
.codebox .code{font-family:"Courier New",monospace;font-size:1.6em;font-weight:900;color:var(--c1);letter-spacing:.08em}
.codebox .sum{background:#fff;border-radius:10px;padding:10px;margin:8px 0;border:1px solid var(--line);user-select:all;-webkit-user-select:all}
.btns{display:grid;gap:10px;margin-top:14px}
.miss{margin-top:18px;text-align:left;background:var(--soft);border-radius:16px;padding:12px 16px}
.miss h3{margin:0 0 8px;font-size:1em}
.miss ul{margin:0;padding-left:20px}
.miss li{margin-bottom:8px;font-size:.9em}
.vgrid{display:grid;gap:4px}
.vout{margin-top:16px;padding:14px;border-radius:14px;background:var(--soft);font-weight:700}
.hidden{display:none!important}
.alertb{background:#fef3c7;border:2px solid #f59e0b;color:#78350f;border-radius:14px;padding:10px 14px;font-weight:700;margin:0 0 12px;animation:up .35s ease}
.antic{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px;text-align:left;font-size:.9em}
.antic li{background:var(--soft);border-radius:12px;padding:8px 12px}
.seg{display:flex;flex-wrap:wrap;align-items:stretch;row-gap:10px;font-size:30px;font-weight:700;padding:14px 10px;border:3px dashed var(--line);border-radius:16px;background:var(--soft);line-height:1.4}
.seg.right{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.seg.wrong{border-style:solid;border-color:var(--ko);background:var(--kobg)}
.sc{display:inline-block;padding:0 1px}
.sg{width:12px;border:0;padding:0;margin:0;background:transparent;cursor:pointer;border-radius:6px;position:relative}
.sg:hover:not(:disabled){background:color-mix(in srgb,var(--c1) 18%,transparent)}
.sg.on{width:22px}
.sg.on::after{content:"";position:absolute;left:50%;top:8%;bottom:8%;width:4px;margin-left:-2px;border-radius:2px;background:var(--c1)}
.segprev{margin-top:10px;font-size:.95em;color:var(--muted)}
.segprev b{color:var(--ink)}
.calm{position:fixed;inset:0;z-index:70;background:rgba(15,18,38,.72);display:grid;place-items:center;padding:16px}
.calmcard{background:#fff;border-radius:24px;padding:24px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.tl{display:grid;gap:10px;margin-top:14px}
.tlb{display:flex;align-items:center;gap:12px;text-align:left;font:inherit;font-weight:700;padding:14px;border-radius:16px;border:3px solid var(--line);background:var(--soft);cursor:pointer;color:var(--ink)}
.tlb small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.tlb .dot{flex:none;width:30px;height:30px;border-radius:50%}
.breath{width:150px;height:150px;margin:18px auto;border-radius:50%;background:radial-gradient(circle,#bbf7d0,#4ade80);animation:breath 8s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(.6)}50%{transform:scale(1)}}
.breathtx{font-size:1.3em;font-weight:800;min-height:1.5em}
footer{color:rgba(255,255,255,.7);text-align:center;font-size:13px;margin-top:18px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
:focus-visible{outline:4px solid #facc15;outline-offset:2px}
@media(min-width:600px){.opts.two{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(3,1fr)}.card{padding:28px}}
@media(max-width:380px){.hud .pill{font-size:14px}.pill small{font-size:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="bar">
    <a class="ib" id="backBtn" href="../index.html" title="Volver al menú" aria-label="Volver al menú de retos" style="text-decoration:none">←</a><div class="brand" id="brand"></div>
    <button class="ib hidden" id="tlBtn" title="Semáforo: pedir pausa" aria-label="Semáforo: cómo me encuentro">🚦</button>
    <button class="ib" id="bigBtn" title="Letra más grande" aria-label="Cambiar tamaño de letra">Aa</button>
    <button class="ib" id="muteBtn" title="Activar o silenciar sonidos" aria-label="Silenciar sonidos">🔊</button>
  </div>

  <section id="sStart" class="card hero"></section>

  <section id="sGame" class="hidden">
    <div class="hud">
      <div class="pill"><small>Puntos</small>⭐ <span id="hP">0</span></div>
      <div class="pill"><small>Racha</small>🔥 <span id="hS">0</span></div>
      <div class="pill"><small>Aciertos</small>✅ <span id="hA">0</span></div>
      <div class="pill"><small>Tiempo</small>⏱ <span id="hT">0:00</span></div>
    </div>
    <div class="prog" aria-hidden="true"><i id="progI"></i></div>
    <div id="passage" class="card passage hidden"></div>
    <div class="card" id="qcard">
      <div class="qhead"><span class="qnum" id="qnum"></span><button class="sb" id="sayQ">🔊 Escuchar</button></div>
      <div class="timebar hidden" id="timebar"><i id="timeI"></i></div>
      <div id="alertb"></div>
      <p class="q" id="qtext"></p>
      <div id="area"></div>
      <div id="fb"></div>
      <div class="actions">
        <button class="btn" id="checkBtn">✔ Comprobar</button>
        <button class="btn hidden" id="nextBtn">Siguiente ➜</button>
      </div>
      <div class="steps mini" aria-hidden="true"><span class="step">1 👀 Lee</span><span class="step">2 🧠 Piensa</span><span class="step">3 👆 Elige</span><span class="step">4 🔁 Revisa y comprueba</span></div>
    </div>
  </section>

  <section id="sEnd" class="card hero hidden"></section>
  <section id="sVerify" class="card hidden"></section>

  <footer>Lengua Castellana y Literatura · 1.º ESO · Sin registro y sin guardar datos</footer>
</div>
<div class="calm hidden" id="calm" role="dialog" aria-modal="true" aria-label="Semáforo"><div class="calmcard" id="calmc"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const D = {"id": "g2-puntuacion", "title": "Código de Puntuación", "emoji": "🔣", "subtitle": "Una coma puede cambiar el significado de todo. Descífralo.", "c1": "#1d4ed8", "c2": "#0891b2", "how": "mira el <b>hueco</b> o compara las oraciones y elige la opción correcta. En la Ruta Galaxia descubrirás cómo la puntuación cambia el significado.", "levels": [{"desc": "Raya, comas, dos puntos, punto y coma, comillas", "items": [{"t": "mc", "q": "___Ya voy —dijo Iker.", "o": ["—", "-", "«"], "a": 0, "e": "En los diálogos, las intervenciones empiezan con <b>raya</b> (—), más larga que el guion."}, {"t": "mc", "q": "Nerea___ ¿me pasas el balón?", "o": [",", ":", "."], "a": 0, "e": "La <b>coma</b> separa el vocativo, el nombre de la persona a la que hablamos."}, {"t": "mc", "q": "Necesitamos tres cosas___ palillos, cola y paciencia.", "o": [":", ";", "."], "a": 0, "e": "Usamos <b>dos puntos</b> antes de una enumeración anunciada."}, {"t": "mc", "q": "¿Qué oración tiene un error de puntuación?", "o": ["Mis compañeros de grupo, terminaron el puente.", "Mis compañeros de grupo terminaron el puente.", "Al final, mis compañeros terminaron el puente."], "a": 0, "e": "No se pone coma entre el <b>sujeto</b> y el <b>verbo</b>."}, {"t": "mc", "q": "Mi compañero, que es muy paciente___ me explicó el problema.", "o": [",", ";", ":"], "a": 0, "e": "Los incisos van <b>entre comas</b>: si se abre, se cierra."}, {"t": "mc", "q": "Estudió muchísimo___ sin embargo, no aprobó.", "o": [";", ":", "¡"], "a": 0, "e": "El <b>punto y coma</b> separa oraciones relacionadas, sobre todo antes de conectores como <i>sin embargo</i>."}, {"t": "mc", "q": "Las comillas «» sirven, entre otras cosas, para…", "o": ["reproducir las palabras exactas de alguien", "separar los elementos de una lista", "cerrar una pregunta"], "a": 0, "e": "Las comillas encierran las <b>citas textuales</b>."}, {"t": "mc", "q": "Los puntos suspensivos indican…", "o": ["que algo queda sin terminar, duda o suspense", "el final de una pregunta", "el principio de un diálogo"], "a": 0, "e": "Los <b>puntos suspensivos</b> dejan algo en el aire."}]}, {"desc": "Puntuación que cambia el significado", "items": [{"t": "mc", "q": "¿En qué oración la persona <b>sí</b> quiere jugar?", "o": ["No, quiero jugar.", "No quiero jugar."], "a": 0, "e": "En «No, quiero jugar», el <i>no</i> responde a otra cosa y la persona afirma que <b>quiere jugar</b>.", "fixed": true}, {"t": "mc", "q": "Un rey recibe una carta. ¿En qué versión se <b>concede</b> el perdón al prisionero?", "o": ["Perdón imposible, que cumpla su condena.", "Perdón, imposible que cumpla su condena."], "a": 1, "e": "En la segunda, «Perdón» es la decisión y «imposible que cumpla su condena» explica que <b>no</b> cumplirá la pena.", "fixed": true}, {"t": "mc", "q": "«Los alumnos, que habían estudiado, aprobaron». ¿Qué significa?", "o": ["Todos habían estudiado y todos aprobaron", "Solo aprobaron los que habían estudiado", "No aprobó nadie"], "a": 0, "e": "Entre comas, la oración es <b>explicativa</b>: se refiere a todos. Sin comas («Los alumnos que habían estudiado aprobaron») sería <b>especificativa</b>: solo algunos."}, {"t": "mc", "q": "Tenía clara la solución___ había comprobado todos los casos.", "o": [":", "¡", "«"], "a": 0, "e": "Los <b>dos puntos</b> pueden introducir una causa o una explicación de lo anterior."}, {"t": "mc", "q": "Lo intenté varias veces___ pero no salió.", "o": [",", ":", ";"], "a": 0, "e": "Se pone <b>coma delante de «pero»</b> cuando une dos oraciones."}, {"t": "mc", "q": "Después de tres horas de debate___ el grupo llegó a un acuerdo.", "o": [",", ":", ";"], "a": 0, "e": "Un complemento largo al <b>principio</b> de la oración se separa con coma."}, {"t": "mc", "q": "Además de en los diálogos, la raya sirve para…", "o": ["encerrar incisos con más separación que las comas", "separar sílabas", "escribir fechas"], "a": 0, "e": "Las <b>rayas</b> pueden aislar incisos, como un paréntesis más ligero."}, {"t": "mc", "q": "¿Qué oración está bien puntuada?", "o": ["—No lo sé —respondió Marta—, pero puedo averiguarlo.", "—No lo sé, respondió Marta, pero puedo averiguarlo.", "-No lo sé -respondió Marta- pero puedo averiguarlo."], "a": 0, "e": "El comentario del narrador va entre <b>rayas</b>, y la coma se coloca <b>después</b> de la raya de cierre."}]}], "calm": true, "routes": [{"n": "Ruta Órbita", "e": "🪐", "c": "#0e7490"}, {"n": "Ruta Galaxia", "e": "🌌", "c": "#6d28d9"}]};
const LV=D.routes||[{n:'Ruta Verde',e:'🟢',c:'#16a34a'},{n:'Ruta Azul',e:'🔵',c:'#2563eb'},{n:'Ruta Morada',e:'🟣',c:'#9333ea'}];
const SYM={'.':'punto',',':'coma',';':'punto y coma',':':'dos puntos','¿':'abre pregunta','?':'cierra pregunta','¡':'abre exclamación','!':'cierra exclamación','—':'raya','-':'guion','«':'comillas','...':'puntos suspensivos'};

function elapsed(){return Math.round((Date.now()-S.t0-S.paused-(S.pauseAt?Date.now()-S.pauseAt:0))/1000)}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function plain(h){const d=document.createElement('div');d.innerHTML=String(h).replace(/___/g,' … ');return d.textContent.replace(/\s+/g,' ').trim()}
function fmt(h){return String(h).replace(/___/g,'<span class="gap"></span>')}

function today(){const d=new Date();return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}
function isSym(o){return o.every(x=>String(x).length<=3)}
function optLabel(o){return SYM[o]?o+' ('+SYM[o]+')':o}

/* ---------- Sonido (Web Audio, sin archivos) ---------- */
let AC=null;
function tone(f,d,type,v,delay){if(S.muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.12,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.05)}catch(e){}}
const SFX={
  click(){tone(640,.06,'triangle',.07)},
  ok(){tone(660,.12,'triangle',.14);tone(880,.2,'triangle',.14,.1)},
  ko(){if(D.calm){tone(392,.16,'sine',.06);tone(330,.22,'sine',.06,.12);return}tone(230,.22,'sawtooth',.06);tone(170,.3,'sawtooth',.06,.12)},
  streak(){[523,659,784,1047].forEach((f,i)=>tone(f,.12,'square',.05,i*.07))},
  end(){[523,659,784,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.12,i*.13))}
};

/* ---------- Lectura en voz alta ---------- */
function speak(t){if(!('speechSynthesis' in window)){toast('Tu navegador no puede leer en voz alta');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.9;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('es'));if(v)u.voice=v;speechSynthesis.speak(u)}

let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2800)}
function show(id){['sStart','sGame','sEnd','sVerify'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id));window.scrollTo({top:0,behavior:'smooth'})}
function anim(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}

/* ---------- Código de verificación ---------- */
function h32(s){let h=2166136261;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,16777619)>>>0}return h>>>0}
function normName(n){return n.normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toLowerCase().replace(/\s+/g,' ')}
function mkCode(n,l,c,t,s,d){const k=[D.id,normName(n),l,c,t,s,d,'IES-LA-ATALAYA'].join('|');const h=(h32(k)^Math.imul(h32(k.split('').reverse().join('')),31))>>>0;return h.toString(36).toUpperCase().padStart(6,'0').slice(-6)}

/* ---------- Inicio ---------- */

  $('#sStart').innerHTML=`<div class="badge">${D.emoji}</div><h1>${esc(D.title)}</h1><p class="sub">${esc(D.subtitle)}</p>

  ${D.calm?`<ul class="antic"><li><b>📋 Qué va a pasar:</b> ${D.levels[0].items.length} retos, uno detrás de otro.</li><li>⏳ No hay límite de tiempo. Puedes pensar con calma.</li><li>🚦 Con el botón del semáforo (arriba) puedes pedir una pausa cuando quieras.</li><li>🔊 Puedes escuchar cada reto en voz alta.</li>${(D.antic||[]).map(a=>`<li>${a}</li>`).join('')}</ul>`:''}
  <label class="lbl" for="nm">✍️ Tu nombre y apellidos</label>
  <input class="txt" id="nm" autocomplete="name" maxlength="60" placeholder="Ej.: Laura Pérez García" value="${esc(S.name)}">
  <div class="hint" id="nmh">Escríbelo bien: aparecerá en tu resultado.</div>

  <div class="lvls" id="lvls"></div>
  <button class="btn wide" id="goBtn">🚀 ¡Empezar!</button>`;

  $('#lvls').innerHTML=idx.map(i=>`<button class="lvl" data-i="${i}" style="--lc:${LV[i].c}" aria-pressed="${S.lvl===i}"><span class="lvl-e">${LV[i].e}</span><span><b>${LV[i].n}</b><small>${esc(D.levels[i].desc)} · ${D.levels[i].items.length} retos</small></span></button>`).join('');
  document.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>{S.lvl=+b.dataset.i;document.querySelectorAll('.lvl').forEach(x=>x.setAttribute('aria-pressed',x===b));SFX.click()});

function start(){

  S.name=n;const L=D.levels[S.lvl];
  S.items=D.keepOrder?L.items.slice():shuffle(L.items.slice());
  Object.assign(S,{i:0,correct:0,score:0,streak:0,best:0,wrong:[],t0:Date.now(),paused:0,pauseAt:0,pauses:0});
  clearInterval(S.timer);S.timer=setInterval(()=>{if(!S.pauseAt)$('#hT').textContent=mmss(elapsed())},1000);

/* ---------- Pregunta ---------- */
function hud(){$('#hP').textContent=S.score;$('#hS').textContent=S.streak;$('#hA').textContent=S.correct+'/'+S.items.length;$('#progI').style.width=(S.i/S.items.length*100)+'%'}
function renderQ(){
  const it=S.items[S.i];S.sel=null;S.answered=false;
  $('#qnum').textContent=`Reto ${S.i+1} de ${S.items.length}`;
  $('#qtext').innerHTML=fmt(it.q);
  $('#fb').innerHTML='';$('#nextBtn').classList.add('hidden');$('#checkBtn').classList.remove('hidden');$('#checkBtn').disabled=true;
  $('#alertb').innerHTML=it.alert?`<div class="alertb">${it.alert}</div>`:'';
  const a=$('#area');
  if(it.t==='seg'){
    const ch=[...it.w.join('')];let p=0;S.exp=it.w.slice(0,-1).map(w=>p+=[...w].length);S.cuts=new Set();
    a.innerHTML=`<div class="seg" id="seg">`+ch.map((c,i)=>`<span class="sc">${esc(c)}</span>`+(i<ch.length-1?`<button class="sg" data-i="${i+1}" aria-label="Separar aquí"></button>`:'')).join('')+`</div><div class="segprev">Tu frase: <b id="segp"></b></div><div class="tools"><button class="sb" id="clr">↺ Quitar separaciones</button></div>`;
    const upd=()=>{let out='';ch.forEach((c,i)=>{if(S.cuts.has(i))out+=' ';out+=c});$('#segp').textContent=out;$('#checkBtn').disabled=S.cuts.size===0};
    a.querySelectorAll('.sg').forEach(b=>b.onclick=()=>{if(S.answered)return;const i=+b.dataset.i;S.cuts.has(i)?S.cuts.delete(i):S.cuts.add(i);b.classList.toggle('on',S.cuts.has(i));upd();SFX.click()});
    $('#clr').onclick=()=>{if(S.answered)return;S.cuts.clear();a.querySelectorAll('.sg').forEach(b=>b.classList.remove('on'));upd()};
    upd();
  } else if(it.t==='order'){
    let bank;let tries=0;do{bank=shuffle(it.w.map((w,k)=>({w,k})));tries++}while(tries<12&&bank.map(x=>x.w).join(' ')===it.w.join(' '));
    S.bank=bank;S.target=[];
    a.innerHTML=`<div class="target" id="tgt" aria-label="Tu oración"></div><div class="bank" id="bank"></div><div class="tools"><button class="sb" id="clr">↺ Empezar de nuevo</button></div>`;
    $('#clr').onclick=()=>{if(S.answered)return;S.bank=S.bank.concat(S.target);S.target=[];drawChips();SFX.click()};
    drawChips();
  } else {
    const opts=it.o.map((o,k)=>({o,k}));S.opts=it.fixed?opts:shuffle(opts);
    const sym=isSym(it.o);const two=!sym&&it.o.every(x=>String(x).length<=28)&&it.o.length%2===0;
    a.innerHTML=`<div class="opts ${sym?'sym':''} ${two?'two':''}">`+S.opts.map((x,j)=>sym
      ?`<button class="opt" data-j="${j}" aria-label="${esc(optLabel(x.o))}"><span class="ltr">${'ABCD'[j]}</span><span class="sym-c">${esc(x.o)}</span><span class="sym-n">${esc(SYM[x.o]||'')}</span></button>`
      :`<button class="opt" data-j="${j}"><span class="ltr">${'ABCD'[j]}</span><span class="otx">${esc(x.o)}</span></button>`).join('')+`</div>`;
    a.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(S.answered)return;S.sel=+b.dataset.j;a.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));$('#checkBtn').disabled=false;SFX.click()});
  }
  if(D.speed){$('#timebar').classList.remove('hidden');S.qT0=performance.now();cancelAnimationFrame(S.raf);const lim=D.speed*1000;const f=t=>{const p=Math.max(0,1-(t-S.qT0)/lim);$('#timeI').style.transform=`scaleX(${p})`;if(p>0&&!S.answered)S.raf=requestAnimationFrame(f)};S.raf=requestAnimationFrame(f)}
  anim($('#qcard'),'pop');
}
function chip(w){const c=document.createElement('button');c.className='chip';c.textContent=w;return c}
function drawChips(){
  const t=$('#tgt'),b=$('#bank');t.innerHTML='';b.innerHTML='';
  S.target.forEach((x,i)=>{const c=chip(x.w);c.onclick=()=>{if(S.answered)return;S.target.splice(i,1);S.bank.push(x);drawChips();SFX.click()};t.appendChild(c)});
  S.bank.forEach((x,i)=>{const c=chip(x.w);c.onclick=()=>{if(S.answered)return;S.bank.splice(i,1);S.target.push(x);drawChips();SFX.click()};b.appendChild(c)});
  $('#checkBtn').disabled=S.bank.length>0;
}
function check(){
  if(S.answered)return;const it=S.items[S.i];let ok,right;
  if(it.t==='seg'){
    const got=[...S.cuts].sort((x,y)=>x-y).join(',');right=it.w.join(' ');ok=got===S.exp.join(',');
    $('#seg').classList.add(ok?'right':'wrong');document.querySelectorAll('.sg,#clr').forEach(c=>c.disabled=true);
  } else if(it.t==='order'){
    if(S.bank.length)return;
    const got=S.target.map(x=>x.w).join(' ');right=it.w.join(' ');
    ok=got===right||(it.alt||[]).includes(got);
    $('#tgt').classList.add(ok?'right':'wrong');
    document.querySelectorAll('.chip,#clr').forEach(c=>c.disabled=true);
  } else {
    if(S.sel===null)return;
    ok=S.opts[S.sel].k===it.a;right=optLabel(it.o[it.a]);
    $('#area').querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(S.opts[j].k===it.a)b.classList.add('right');else if(j===S.sel)b.classList.add('wrong')});
  }
  S.answered=true;cancelAnimationFrame(S.raf);
  let pts=0;
  if(ok){
    S.correct++;S.streak++;S.best=Math.max(S.best,S.streak);
    pts=100+Math.min(50,10*(S.streak-1));
    if(D.speed){pts+=Math.round(50*Math.max(0,1-(performance.now()-S.qT0)/(D.speed*1000)))}
    S.score+=pts;SFX.ok();floatPts('+'+pts);
    if([3,5,8].includes(S.streak)){setTimeout(()=>{SFX.streak();toast(`🔥 ¡Racha de ${S.streak} aciertos!`)},350)}
  } else {
    S.streak=0;SFX.ko();anim($('#qcard'),'shake');
    S.wrong.push({q:plain(it.q),a:right});
  }
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><span class="big"><b>${ok?pick(OKM):pick(KOM)}</b></span><p>${ok?'':'Respuesta correcta: <strong>'+esc(right)+'</strong><br>'}${it.e||''}</p></div>`;
  $('#checkBtn').classList.add('hidden');const nb=$('#nextBtn');nb.classList.remove('hidden');nb.textContent=S.i+1<S.items.length?'Siguiente ➜':'🏁 Ver resultado';
  hud();setTimeout(()=>{nb.focus({preventScroll:true});$('#fb').scrollIntoView({behavior:'smooth',block:'nearest'})},60);
}
function floatPts(t){const r=$('#checkBtn').getBoundingClientRect();const s=document.createElement('div');s.className='float';s.textContent=t;s.style.left=(r.left+r.width/2-30)+'px';s.style.top=(r.top-10)+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}
function next(){S.i++;if(S.i>=S.items.length)finish();else{renderQ();hud();$('#qcard').scrollIntoView({behavior:'smooth',block:'start'})}}

/* ---------- Resultado ---------- */
function finish(){
  clearInterval(S.timer);cancelAnimationFrame(S.raf);
  if(S.pauseAt){S.paused+=Date.now()-S.pauseAt;S.pauseAt=0}const secs=elapsed(),tot=S.items.length,c=S.correct,pct=Math.round(c/tot*100);
  const nota=Math.round(c/tot*100)/10,notaTxt=nota.toLocaleString('es-ES'),date=today();
  const code=mkCode(S.name,S.lvl,c,tot,secs,date);
  S.result={name:S.name,lvl:S.lvl,c,tot,pct,notaTxt,time:mmss(secs),date,code};
  const sum=`${D.title} | ${LV[S.lvl].n} | Alumno/a: ${S.name} | Nota: ${notaTxt}/10 (${c}/${tot} aciertos, ${pct} %) | Tiempo: ${mmss(secs)} | Fecha: ${date} | Cód: #${code}`+(D.calm?` | Pausas pedidas: ${S.pauses}`:'');
  S.sum=sum;
  const em=pct>=90?'🏆':pct>=70?'🥇':pct>=50?'👍':'💪';
  const msg=pct>=90?'¡Campeón/a del reto!':pct>=70?'¡Muy buen trabajo!':pct>=50?'¡Bien! Vas por buen camino':'¡Sigue entrenando, lo vas a conseguir!';
  $('#sEnd').innerHTML=`<div class="res-emoji">${em}</div><h2>${msg}</h2><p class="sub">${esc(S.name)} · ${LV[S.lvl].e} ${LV[S.lvl].n}</p>
  <div class="stats">
    <div class="stat"><b>${notaTxt}</b><span>Nota sobre 10</span></div>
    <div class="stat"><b>${c}/${tot}</b><span>Aciertos</span></div>
    <div class="stat"><b>${pct} %</b><span>Porcentaje</span></div>
    <div class="stat"><b>${mmss(secs)}</b><span>Tiempo</span></div>
    <div class="stat"><b>${S.score}</b><span>Puntos</span></div>
    <div class="stat"><b>🔥 ${S.best}</b><span>Mejor racha</span></div>
  </div>
  <div class="codebox"><b>📎 Tu resultado para Classroom</b><div class="sum" id="sumTxt">${esc(sum)}</div>Código de verificación: <span class="code">#${code}</span><br><small>Pulsa «Copiar» y pégalo como <b>comentario privado</b> en la tarea. ${NOPNG?'Si no puedes copiar, haz una captura de pantalla de esta pantalla.':'También puedes descargar el certificado o hacer una captura de pantalla.'}</small></div>
  <div class="btns">
    <button class="btn" id="cpBtn">📋 Copiar resultado para Classroom</button>
    ${NOPNG?'':'<button class="btn ghost" id="pngBtn">🖼️ Descargar certificado (imagen)</button>'}
    <button class="btn ghost" id="againBtn">🔁 Jugar otra vez</button>
  </div>
  ${S.wrong.length?`<div class="miss"><h3>🔎 Repasa estos retos</h3><ul>${S.wrong.map(w=>`<li>${esc(w.q)}<br>➜ <b>${esc(w.a)}</b></li>`).join('')}</ul></div>`:'<div class="miss"><h3>🌟 ¡Sin fallos! Prueba otra ruta si tu profe te lo indica.</h3></div>'}`;
  $('#progI').style.width='100%';
  $('#tlBtn').classList.add('hidden');
  $('#cpBtn').onclick=async()=>{const ok=await copyText(sum);if(ok){toast('✅ ¡Copiado! Pégalo en la tarea de Classroom');SFX.ok()}else{selectSum();toast('Selecciona el texto y cópialo a mano')}};
  if($('#pngBtn'))$('#pngBtn').onclick=certificate;
  $('#againBtn').onclick=()=>{initStart();show('sStart')};
  show('sEnd');SFX.end();if(pct>=50)confetti();
}
function selectSum(){const r=document.createRange();r.selectNodeContents($('#sumTxt'));const s=getSelection();s.removeAllRanges();s.addRange(r)}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();return ok}}
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
function certificate(){
  const R=S.result,c=document.createElement('canvas');c.width=1200;c.height=800;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,1200,800);g.addColorStop(0,D.c1);g.addColorStop(1,D.c2);x.fillStyle=g;x.fillRect(0,0,1200,800);
  rr(x,50,50,1100,700,40);x.fillStyle='#fff';x.fill();

  x.font='bold 26px Verdana, sans-serif';x.fillStyle='#5b6287';x.fillText('Certificado de resultado · '+LV[R.lvl].n+' · Lengua 1.º ESO',600,295);
  x.fillStyle='#1c2042';let fs=56;do{x.font=`900 ${fs}px "Arial Black", sans-serif`;fs-=2}while(x.measureText(R.name).width>1000&&fs>24);x.fillText(R.name,600,385);
  x.font='bold 34px Verdana, sans-serif';x.fillText(`Nota: ${R.notaTxt}/10  ·  ${R.c}/${R.tot} aciertos  ·  ${R.pct} %`,600,470);
  x.fillText(`Tiempo: ${R.time}  ·  Fecha: ${R.date}`,600,525);
  rr(x,330,575,540,90,24);x.fillStyle='#f5f6fc';x.fill();
  x.fillStyle=D.c1;x.font='900 52px "Courier New", monospace';x.fillText('Cód: #'+R.code,600,637);
  x.font='20px Verdana, sans-serif';x.fillStyle='#8a90b0';x.fillText('Adjunta esta imagen en tu tarea de Google Classroom',600,715);
  c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`resultado-${D.id}-${normName(R.name).replace(/\s+/g,'-')}.png`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('🖼️ Certificado descargado')});
}
function confetti(){
  const cv=$('#fx'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=[D.c1,D.c2,'#facc15','#22c55e','#38bdf8','#f472b6'];
  const ps=Array.from({length:150},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.6,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6.3,vr:(Math.random()-.5)*.3,s:6+Math.random()*7,c:pick(cols)}));
  const t0=performance.now();
  (function f(t){x.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(t-t0<4200)requestAnimationFrame(f);else x.clearRect(0,0,cv.width,cv.height)})(t0);
}

/* ---------- Verificación (docente): añade ?verificar a la dirección ---------- */
function initVerify(){
  $('#sVerify').innerHTML=`<h2>🔒 Verificar un resultado</h2><p class="sub">Copia los datos del resultado que te ha entregado el alumno o la alumna.</p>
  <div class="vgrid">
  <label class="lbl" for="vN">Nombre y apellidos</label><input class="txt" id="vN">
  <label class="lbl" for="vL">Ruta</label><select class="txt" id="vL">${LV.map((l,i)=>`<option value="${i}">${l.n}</option>`).join('')}</select>
  <label class="lbl" for="vC">Aciertos (el primer número de «x/y aciertos»)</label><input class="txt" id="vC" inputmode="numeric">
  <label class="lbl" for="vT">Total de retos</label><input class="txt" id="vT" inputmode="numeric" value="${D.levels[0].items.length}">
  <label class="lbl" for="vS">Tiempo (m:ss)</label><input class="txt" id="vS" placeholder="3:25">
  <label class="lbl" for="vD">Fecha (dd/mm/aaaa)</label><input class="txt" id="vD" value="${today()}">
  <label class="lbl" for="vK">Código entregado (sin #)</label><input class="txt" id="vK">
  </div><button class="btn wide" id="vBtn">Comprobar código</button><div class="vout" id="vOut">Rellena los datos y pulsa «Comprobar».</div>`;
  $('#vBtn').onclick=()=>{const p=$('#vS').value.trim().split(':');const secs=(+p[0]||0)*60+(+p[1]||0);const code=mkCode($('#vN').value,+$('#vL').value,+$('#vC').value,+$('#vT').value,secs,$('#vD').value.trim());const k=$('#vK').value.trim().replace('#','').toUpperCase();$('#vOut').innerHTML=k?(k===code?'✅ El código coincide: el resultado es auténtico.':`❌ No coincide. Con estos datos el código sería <b>#${code}</b>.`):`El código correcto para estos datos es <b>#${code}</b>.`};
  show('sVerify');
}

/* ---------- Semáforo de autorregulación ---------- */
let brT;
function calmOpen(){if(!S.pauseAt)S.pauseAt=Date.now();$('#calm').classList.remove('hidden');calmMenu()}
function calmClose(){clearInterval(brT);if(S.pauseAt){S.paused+=Date.now()-S.pauseAt;S.pauseAt=0}$('#calm').classList.add('hidden');if('speechSynthesis' in window)speechSynthesis.cancel()}
function calmMenu(){clearInterval(brT);$('#calmc').innerHTML=`<h2>🚦 ¿Cómo estás ahora?</h2><p class="sub">El tiempo del juego está parado.</p><div class="tl">
<button class="tlb" id="tlG"><span class="dot" style="background:#22c55e"></span><span>Verde<small>Estoy bien, puedo seguir.</small></span></button>
<button class="tlb" id="tlY"><span class="dot" style="background:#facc15"></span><span>Amarillo<small>Necesito apoyo o una pausa corta.</small></span></button>
<button class="tlb" id="tlR"><span class="dot" style="background:#ef4444"></span><span>Rojo<small>Necesito parar y estar tranquilo.</small></span></button></div>`;
$('#tlG').onclick=calmClose;$('#tlY').onclick=()=>{S.pauses++;calmYellow()};$('#tlR').onclick=()=>{S.pauses++;calmRed()};$('#tlG').focus()}
function calmYellow(){$('#calmc').innerHTML=`<h2>🟡 Pausa corta</h2><p class="sub">Sigue el círculo: crece al inspirar y se hace pequeño al soltar el aire. Puedes avisar a tu profe si necesitas ayuda.</p><div class="breath"></div><div class="breathtx" id="btx">Inspira…</div><div class="tl"><button class="btn" id="tlBack">✅ Ya estoy mejor, vuelvo al juego</button><button class="btn ghost" id="tlMenu">🚦 Cambiar de color</button></div>`;
let inn=true;brT=setInterval(()=>{inn=!inn;const b=$('#btx');if(b)b.textContent=inn?'Inspira…':'Suelta el aire…'},4000);$('#tlBack').onclick=calmClose;$('#tlMenu').onclick=calmMenu}
function calmRed(){clearInterval(brT);$('#calmc').innerHTML=`<h2>🔴 Paramos aquí</h2><p>Has hecho bien en avisar. El juego te espera y no pierdes nada de lo que llevas.</p><p class="sub">Puedes enseñar esta pantalla a tu profe, ir a tu espacio tranquilo o simplemente descansar.</p><div class="tl"><button class="btn" id="tlBack">Estoy listo para volver</button><button class="btn ghost" id="tlMenu">🚦 Cambiar de color</button></div>`;$('#tlBack').onclick=calmClose;$('#tlMenu').onclick=calmMenu}
$('#tlBtn').onclick=calmOpen;

/* ---------- Controles generales ---------- */
$('#brand').textContent=D.emoji+' '+D.title;
$('#checkBtn').onclick=check;$('#nextBtn').onclick=next;
$('#sayQ').onclick=()=>{const it=S.items[S.i];speak((it.alert?plain(it.alert)+'. ':'')+plain(it.q)+(it.t!=='mc'?'':'. Opciones: '+S.opts.map((x,j)=>'ABCD'[j]+': '+(SYM[x.o]||x.o)).join('. ')))};
$('#muteBtn').onclick=()=>{S.muted=!S.muted;$('#muteBtn').textContent=S.muted?'🔇':'🔊';toast(S.muted?'Sonidos desactivados':'Sonidos activados')};
$('#bigBtn').onclick=()=>{document.body.classList.toggle('big');try{localStorage.setItem('lenguaBig',document.body.classList.contains('big')?'1':'0')}catch(e){}};
try{if(localStorage.getItem('lenguaBig')==='1')document.body.classList.add('big')}catch(e){}
document.addEventListener('keydown',e=>{
  if(!$('#calm').classList.contains('hidden'))return;
  if($('#sGame').classList.contains('hidden')||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;
  const it=S.items[S.i];
  if(!S.answered&&it.t==='mc'&&/^[1-4]$/.test(e.key)){const b=$('#area').querySelectorAll('.opt')[+e.key-1];if(b)b.click()}
  if(e.key==='Enter'){e.preventDefault();if(S.answered)next();else if(!$('#checkBtn').disabled)check()}
});
try{const pg=sessionStorage.getItem('retosPagina');if(pg)$('#backBtn').href='../'+pg+'.html'}catch(e){}
if(P.has('verificar'))initVerify();else initStart();
</script>
