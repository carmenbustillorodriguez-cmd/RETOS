<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retos de Aula</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#f6f7fb;--surface:#fff;--fg:#1b1f3a;--muted:#5a6080;--line:#e1e4f0;--accent:#334155;--on:#fff;--display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;--body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#11131f;--surface:#1b1e2e;--fg:#eef0fa;--muted:#a3a8c3;--line:#2c3046;--accent:#94a3b8;--on:#11131f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;padding:0 max(16px,env(safe-area-inset-left))}
.wrap{max-width:660px;margin:0 auto;padding:28px 0 48px;display:grid;gap:22px}
.tag{display:inline-flex;gap:8px;background:var(--accent);color:var(--on);font-weight:700;padding:6px 14px;border-radius:999px;font-size:15px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,8vw,52px);line-height:1;margin:12px 0 6px}
h2{font-family:var(--display);font-size:22px;margin:8px 0 0}
.lead{color:var(--muted);margin:0}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.how li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:14px;line-height:1.35;counter-increment:s}
.how li::before{content:"Paso " counter(s);display:block;font-family:var(--display);font-weight:800;color:var(--accent);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
@media (max-width:520px){.how{grid-template-columns:1fr}}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.g{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:2px solid var(--line);border-radius:18px;color:inherit;text-decoration:none}
a.g:hover{border-color:var(--accent)}
.em{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:28px;background:var(--bg)}
.tx{flex:1;min-width:0;display:grid;gap:2px}.k{font-size:13px;color:var(--muted)}.t{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.2}
.go{font-weight:700;color:var(--accent);font-size:15px}@media (max-width:420px){.go{display:none}}
.routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rt{display:block;padding:14px 16px;border-radius:18px;color:#fff;text-decoration:none;font-family:var(--display);font-weight:800;font-size:21px}
.rt small{display:block;font-family:var(--body);font-weight:400;font-size:14px;opacity:.92}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.mini a{font-size:13px;font-weight:700;padding:5px 10px;border-radius:10px;border:2px solid var(--line);color:var(--fg);text-decoration:none;background:var(--surface)}
footer{color:var(--muted);font-size:13px}
</style></head><body><main class="wrap"><header><h1>Retos de Aula</h1><p class="lead">Elige tu página para ver tus juegos.</p></header>
<h2>Lengua</h2><div class="routes"><a class="rt" style="background:#15803d" href="verde.html">🟢 Ruta Verde</a><a class="rt" style="background:#1d4ed8" href="azul.html">🔵 Ruta Azul</a><a class="rt" style="background:#7e22ce" href="morada.html">🟣 Ruta Morada</a></div>
<h2>Habilidades y retos</h2><div class="routes"><a class="rt" style="background:#c2410c" href="orion.html">🌟 Orión</a><a class="rt" style="background:#0e7490" href="vega.html">💫 Vega</a><a class="rt" style="background:#4338ca" href="sirio.html">✨ Sirio</a><a class="rt" style="background:#be123c" href="lyra.html">🌙 Lyra</a><a class="rt" style="background:#047857" href="nova.html">☄️ Nova</a></div>
<h2>Todos los juegos</h2><div id="todos"></div>
<footer>IES La Atalaya · 1.º ESO · Para comprobar el código de un resultado, pulsa «🔒 Verificar» en el juego.</footer></main>
<script src="catalogo.js"></script><script>
const fila=j=>`<li><div class="g"><span class="em">${j.emoji}</span><span class="tx"><span class="k">${j.area} · ${j.tema}</span><span class="t">${j.titulo}</span><span class="mini">`+((j.grupo||1)===1?`<a href="${j.archivo}?ruta=1">🟢 Verde</a><a href="${j.archivo}?ruta=2">🔵 Azul</a><a href="${j.archivo}?ruta=3">🟣 Morada</a>`:`<a href="${j.archivo}">▶ Jugar</a>`)+`<a href="${j.archivo}?verificar">🔒 Verificar</a></span></span></div></li>`;
document.getElementById("todos").innerHTML='<ul class="list">'+CATALOGO.map(fila).join("")+'</ul>';
</script></body></html>
